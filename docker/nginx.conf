# Reverse proxy in front of the API (optional; BHPanel manages Nginx itself —
# see docs/DEPLOYMENT.md. This file is for a plain Docker VPS setup).
# Dashboard (apps/web) is served as static files from the same host in
# production, or by the API process — see docs/ARCHITECTURE.md.
upstream router_api {
    server api:3001;
}

server {
    listen 80;
    server_name router.developersbd.top;

    # Gateway + dashboard API
    location /v1/ {
        proxy_pass http://router_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming: no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://router_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://router_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Static dashboard build (apps/web/dist) — mount the built files here.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
